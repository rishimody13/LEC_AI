[project]
name = "reconcile"
version = "0.1.0"
description = "An agent that reassigns returned warehouse stock when box labels disagree with the warehouse system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "pillow>=11.0",
    "pyyaml>=6.0",
    "rich>=13.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
demo = ["streamlit>=1.40", "altair>=5.4"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "common", "world", "services", "ledger", "downstream", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "llm: needs a live model call (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["agent", "services", "ledger", "downstream", "harness"]
ignore_missing_imports = true
