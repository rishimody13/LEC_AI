# One entry per test case. Faults are configuration, not code paths - adding a
# seventh case needs no code change.
#
# The observed_* fields record what the agent actually does today. They are NOT
# independent expectations: they were written down after running the code, so a
# test asserting them only detects change. The properties that are genuinely
# asserted live in tests/test_generalises.py.
#
# label_reader:  cassette | unavailable
# label_damage:  a profile name from world.labels.PROFILES
# wms:           fault switches for the warehouse system query
# registry / ledger: fault switches for the paid lookups

S1:
  name: Clean
  description: Label agrees with the only shipment on record.
  return_id: RET-S1
  label_damage: clean
  label_reader: cassette
  observed_outcome: commit
  observed_batch: B-2293
  observed_gathers: false

S2:
  name: Unreadable label
  description: Water damage destroyed the code, but only one batch was ever sent here.
  return_id: RET-S2
  label_damage: water_damage
  label_reader: cassette
  observed_outcome: commit
  observed_batch: B-2293
  observed_gathers: true

S3:
  name: Nothing to go on
  description: Glare destroyed the code and the date, and three batches were sent here.
  return_id: RET-S3
  label_damage: heavy_glare
  label_reader: cassette
  observed_outcome: escalate
  observed_batch: null
  observed_gathers: false

S4:
  name: The obvious answer is wrong
  description: >
    Crisp, check-digit-valid label naming a batch the warehouse never sent this
    customer. The consignee runs a repacking line.
  return_id: RET-S4
  label_damage: clean
  label_reader: cassette
  observed_outcome: commit
  observed_batch: B-2288
  observed_gathers: true

S5:
  name: Both sources degraded
  description: >
    Glare over the end of the code, and the warehouse query is served by a replica
    that last synchronised before the July shipment - so that shipment is missing
    with no error raised.
  return_id: RET-S5
  label_damage: partial_glare
  label_reader: cassette
  wms:
    stale_as_of: 2026-07-10
  observed_outcome: escalate
  observed_batch: null
  observed_gathers: false

S6:
  name: Near-miss twins
  description: >
    A piece of the label is torn away; the surviving fragment fits both batches
    this customer was sent, and the date that would settle it is gone.
  return_id: RET-S6
  label_damage: torn_piece
  label_reader: cassette
  # Was segregate until holding stock was priced honestly. A hold is now dated at
  # the earliest expiry any batch of this product has, which is the only date
  # that is safe when the stock might be a batch nobody named. That costs real
  # shelf life, and on 77 units twenty minutes of an analyst is cheaper. The
  # margin over paying for a lookup is only £0.30, and the trace says so.
  observed_outcome: escalate
  observed_batch: null
  observed_gathers: false

S7:
  name: The answer is only in the note
  description: >
    Cross-docked stock with no delivery paperwork and a soaked label. Neither the
    records nor the label name the batch. The only place it appears is written out
    in the condition note, which a database query cannot read.
  return_id: RET-S7
  label_damage: water_damage
  label_reader: cassette
  observed_outcome: escalate
  observed_batch: null
  observed_gathers: false

S8:
  name: Corrupted, not unreadable
  description: >
    A blot of ink has filled the hole in one digit. The code is perfectly legible
    and reads B-2298-5, which is not a batch that exists - and the check digit
    does not agree, which is the tell. The character confusion table is what
    works out which real code it was.
  return_id: RET-S8
  label_damage: ink_blot
  label_reader: cassette
  observed_outcome: commit
  observed_batch: B-2290
  observed_gathers: true

# Extra cases used only by the failure-isolation tests, to show each source can
# fail on its own without the other one being touched.
X-label-down:
  name: Label reader unavailable
  description: The reader itself is down. No image evidence at all.
  return_id: RET-S1
  label_damage: clean
  label_reader: unavailable
  observed_outcome: commit
  observed_batch: B-2293
  observed_gathers: true

X-wms-down:
  name: Warehouse system timeout
  description: The warehouse query never comes back. The label is perfect.
  return_id: RET-S1
  label_damage: clean
  label_reader: cassette
  wms:
    timeout: true
  # The label still reads perfectly, so its batch goes on the list even though
  # nothing can be verified. With no home bin to file it in, holding the stock
  # beats both committing and calling a person.
  observed_outcome: segregate
  observed_batch: null
  observed_gathers: false

X-wms-conflicting:
  name: Contradictory warehouse rows
  description: The same shipment comes back twice naming two different batches.
  return_id: RET-S1
  label_damage: clean
  label_reader: cassette
  wms:
    conflicting_rows: true
  observed_outcome: commit
  observed_batch: B-2293
  observed_gathers: true

X-registry-down:
  name: Paid lookup unavailable
  description: The hero case, but the batch registry cannot be reached.
  return_id: RET-S4
  label_damage: clean
  label_reader: cassette
  registry:
    unavailable: true
  observed_outcome: escalate
  observed_batch: null
  observed_gathers: false
